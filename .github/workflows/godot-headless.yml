name: Godot 4.7.2 headless verification

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout BTH
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project resources
        run: '"$GODOT_BIN" --headless --editor --path . --import'

      - name: Run BTH headless smoke test
        run: '"$GODOT_BIN" --headless --path . res://tests/smoke_test.tscn'

      - name: Run performance benchmark
        run: '"$GODOT_BIN" --headless --path . res://tests/perf_bench.tscn -- --label=ci'

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: bth-perf-ci-report
          path: docs/perf_ci.json
          if-no-files-found: error
          retention-days: 14
